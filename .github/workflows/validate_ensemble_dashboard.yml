name: Verify Reference26 residual dashboard

on:
  pull_request:
    paths:
      - "site/index.html"
      - "site/reference26_residuals.js"
      - "site/reference26_residuals.css"
      - "site/data/reference26_residuals.json"
      - "tests/test_reference26_residuals.cjs"
      - ".github/workflows/validate_ensemble_dashboard.yml"
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript syntax
        run: node --check site/reference26_residuals.js
      - name: Verify provenance and chart contracts
        run: node --test tests/test_reference26_residuals.cjs
