services:
  - type: web
    name: geoc-agrospatial-analog-inference
    runtime: python
    plan: free
    buildCommand: pip install -r deployment/requirements-api.txt
    startCommand: uvicorn deployment.agrospatial_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: GEOCEBADA_MEAN_MODEL_SHA256
        sync: false
      - key: GEOCEBADA_MEAN_MODEL_PATH
        value: deployment/model_artifacts/reference26_mean_train138.joblib
